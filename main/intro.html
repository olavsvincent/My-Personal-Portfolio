
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050811">
<title>Computer Engineering | Vincent</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --blue: #00d9ff;
  --purple: #8065ff;
  --bg: #050811;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: white;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  display: grid;
  place-items: center;
  isolation: isolate;
  background:
    radial-gradient(ellipse at 50% 45%, #101e39 0%, #080d1b 40%, #03050b 100%);
}

#canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.grid {
  position: absolute;
  inset: -50%;
  z-index: -1;
  opacity: .22;
  background-image:
    linear-gradient(#00d9ff20 1px, transparent 1px),
    linear-gradient(90deg, #00d9ff20 1px, transparent 1px);
  background-size: 45px 45px;
  transform: perspective(500px) rotateX(55deg) scale(1.5);
  animation: gridMove 12s linear infinite;
  mask-image: linear-gradient(transparent, black 30%, black 70%, transparent);
}

.glow {
  position: absolute;
  width: 350px;
  height: 350px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: .16;
  z-index: -1;
  pointer-events: none;
}

.glow.blue {
  background: var(--blue);
  left: -150px;
  top: 10%;
  animation: float 8s ease-in-out infinite alternate;
}

.glow.purple {
  background: var(--purple);
  right: -150px;
  bottom: 5%;
  animation: float 9s ease-in-out infinite alternate-reverse;
}

.hud {
  position: absolute;
  top: 28px;
  left: 35px;
  right: 35px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  color: #7b91b3;
  animation: fadeIn 1s both;
}

.brand {
  color: var(--blue);
}

.online {
  display: flex;
  align-items: center;
  gap: 8px;
}

.online span {
  width: 6px;
  height: 6px;
  background: #00ffb3;
  border-radius: 50%;
  box-shadow: 0 0 12px #00ffb3;
  animation: blink 1s infinite;
}

.hero {
  width: min(100% - 36px, 1100px);
  text-align: center;
  padding: 35px 0;
}

.chip {
  width: 84px;
  height: 84px;
  margin: 0 auto 35px;
  border: 1px solid #00d9ff80;
  background: linear-gradient(145deg, #0d2339, #090d1b);
  display: grid;
  place-items: center;
  position: relative;
  box-shadow:
    0 0 30px #00d9ff20,
    inset 0 0 25px #00d9ff12;
  opacity: 0;
  animation: chipReveal 1s .3s forwards;
}

.chip::before,
.chip::after {
  content: "";
  position: absolute;
  inset: -8px;
  border: 1px solid #00d9ff30;
}

.chip::after {
  inset: -16px;
  border-color: #8065ff25;
  animation: rotate 15s linear infinite;
}

.chip svg {
  width: 44px;
  height: 44px;
  stroke: var(--blue);
  fill: none;
  stroke-width: 1.3;
  filter: drop-shadow(0 0 8px #00d9ff80);
}

.eyebrow {
  color: var(--blue);
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(8px, 1.4vw, 11px);
  letter-spacing: clamp(2px, .8vw, 6px);
  margin-bottom: 23px;
  opacity: 0;
  animation: fadeIn 1s .7s forwards;
}

h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(32px, 7.8vw, 88px);
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: clamp(-4px, -.4vw, -1px);
  opacity: 0;
  animation: titleReveal 1.3s .9s cubic-bezier(.16,1,.3,1) forwards;
}

h1 .second {
  display: block;
  color: transparent;
  background: linear-gradient(90deg, #00d9ff, #a78bfa, #00d9ff);
  background-size: 200% auto;
  background-clip: text;
  -webkit-background-clip: text;
  animation: gradient 4s linear infinite;
  filter: drop-shadow(0 0 20px #00d9ff20);
}

.subtitle {
  margin-top: 24px;
  color: #aab8d0;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(9px, 1.5vw, 13px);
  letter-spacing: clamp(2px, .5vw, 5px);
  opacity: 0;
  animation: fadeIn 1s 1.8s forwards;
}

.divider {
  height: 1px;
  width: 0;
  margin: 26px auto;
  background: linear-gradient(90deg, transparent, var(--blue), var(--purple), transparent);
  box-shadow: 0 0 15px var(--blue);
  animation: expand 1.1s 2s forwards;
}

.description {
  color: #7f91ad;
  font-size: clamp(11px, 1.5vw, 14px);
  letter-spacing: 1px;
  line-height: 1.8;
  opacity: 0;
  animation: fadeIn 1s 2.3s forwards;
}

.skills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 30px;
  opacity: 0;
  animation: fadeIn 1s 2.6s forwards;
}

.skills span {
  padding: 9px 13px;
  border: 1px solid #00d9ff25;
  background: #00d9ff08;
  color: #91d9ee;
  font-family: 'Orbitron', sans-serif;
  font-size: 8px;
  letter-spacing: 1px;
}

.footer {
  position: absolute;
  left: 35px;
  right: 35px;
  bottom: 27px;
  display: flex;
  justify-content: space-between;
  gap: 15px;
  color: #596b89;
  font-family: 'Orbitron', sans-serif;
  font-size: 8px;
  letter-spacing: 1.5px;
  animation: fadeIn 1s 1s both;
}

.footer strong {
  color: var(--blue);
  font-weight: 500;
}

.progress {
  position: absolute;
  height: 2px;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #ffffff10;
}

.progress span {
  display: block;
  width: 100%;
  height: 100%;
  transform: scaleX(0);
  transform-origin: left;
  background: linear-gradient(90deg, var(--purple), var(--blue));
  box-shadow: 0 0 12px var(--blue);
  animation: loading 8s linear forwards;
}

.exit {
  animation: exitScene .7s forwards;
  pointer-events: none;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

@keyframes titleReveal {
  from {
    opacity: 0;
    transform: translateY(35px);
    filter: blur(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

@keyframes chipReveal {
  from { opacity: 0; transform: scale(.5) rotate(-25deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes expand {
  to { width: min(430px, 80vw); }
}

@keyframes gradient {
  to { background-position: 200% center; }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes blink {
  50% { opacity: .3; }
}

@keyframes gridMove {
  to { background-position: 0 90px; }
}

@keyframes float {
  to { transform: translate(60px, -40px); }
}

@keyframes loading {
  to { transform: scaleX(1); }
}

@keyframes exitScene {
  to {
    opacity: 0;
    transform: scale(1.07);
    filter: blur(12px);
  }
}

@media (max-width: 600px) {
  .hud { top: 20px; left: 18px; right: 18px; font-size: 7px; }
  .footer { left: 18px; right: 18px; bottom: 20px; font-size: 6px; }
  .chip { width: 66px; height: 66px; margin-bottom: 28px; }
  .hero { width: calc(100% - 30px); }
  .skills { gap: 6px; }
  .skills span { padding: 8px; font-size: 7px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
  }
}
</style>
</head>

<body>
<div class="scene" id="scene">
  <canvas id="canvas"></canvas>
  <div class="grid"></div>
  <div class="glow blue"></div>
  <div class="glow purple"></div>

  <header class="hud">
    <div class="brand">SV // ENGINEERING</div>
    <div class="online"><span></span> SYSTEM ONLINE</div>
  </header>

  <main class="hero">
    <div class="chip">
      <svg viewBox="0 0 48 48" aria-label="Microchip icon">
        <rect x="12" y="12" width="24" height="24" rx="2"/>
        <rect x="18" y="18" width="12" height="12" rx="1"/>
        <path d="M18 4v8 M30 4v8 M18 36v8 M30 36v8 M4 18h8 M4 30h8 M36 18h8 M36 30h8"/>
        <path d="M21 22h6v4h-6z"/>
      </svg>
    </div>

    <div class="eyebrow">HARDWARE MEETS SOFTWARE</div>

    <h1>
      COMPUTER
      <span class="second">ENGINEERING</span>
    </h1>

    <div class="subtitle">
      SHANE VINCENT OLAVARIO
    </div>

    <div class="divider"></div>

    <p class="description">
      Designing systems. Building solutions.<br>
      Connecting circuits, code, and creativity.
    </p>

    <div class="skills">
      <span>MICROCONTROLLERS</span>
      <span>PROGRAMMING</span>
      <span>EMBEDDED SYSTEMS</span>
      <span>IoT TECHNOLOGY</span>
    </div>
  </main>

  <footer class="footer">
    <span>CE // <strong>FUTURE IN DEVELOPMENT</strong></span>
    <span>01000011 01000101</span>
  </footer>

  <div class="progress"><span></span></div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scene = document.getElementById("scene");

let w, h, particles = [], nodes = [], frame;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  w = innerWidth;
  h = innerHeight;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  particles = Array.from({ length: Math.min(110, Math.floor(w / 8)) }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.8 + .3,
    speed: Math.random() * .55 + .12,
    alpha: Math.random() * .6 + .15
  }));

  nodes = Array.from({ length: 24 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    length: Math.random() * 55 + 15,
    horizontal: Math.random() > .5,
    phase: Math.random() * Math.PI * 2
  }));
}

function draw(time = 0) {
  ctx.clearRect(0, 0, w, h);

  // Circuit-board traces.
  nodes.forEach((n, i) => {
    ctx.beginPath();
    ctx.strokeStyle = i % 2
      ? "rgba(0,217,255,0.13)"
      : "rgba(128,101,255,0.15)";
    ctx.lineWidth = 1;

    if (n.horizontal) {
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x + n.length, n.y);
      ctx.lineTo(n.x + n.length, n.y + 20);
    } else {
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x, n.y + n.length);
      ctx.lineTo(n.x + 20, n.y + n.length);
    }
    ctx.stroke();

    const pulse = (Math.sin(time * .002 + n.phase) + 1) / 2;
    ctx.fillStyle = `rgba(0,217,255,${pulse * .7})`;
    ctx.beginPath();
    ctx.arc(n.x, n.y, 1.5 + pulse, 0, Math.PI * 2);
    ctx.fill();
  });

  // Floating digital particles.
  particles.forEach(p => {
    if (!reduceMotion) {
      p.y -= p.speed;
      if (p.y < -5) {
        p.y = h + 5;
        p.x = Math.random() * w;
      }
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(90,210,255,${p.alpha})`;
    ctx.fill();
  });

  // Small streams of binary code.
  ctx.font = "10px monospace";
  ctx.fillStyle = "rgba(0,217,255,0.16)";

  for (let i = 0; i < 12; i++) {
    const x = (i * w / 12) + 10;
    const y = (time * .025 + i * 77) % (h + 100) - 50;
    ctx.fillText(i % 2 ? "0101" : "1010", x, y);
  }

  if (!reduceMotion) frame = requestAnimationFrame(draw);
}

addEventListener("resize", resize);
resize();
draw();

// Automatic transition into the existing portfolio homepage.
if (!reduceMotion) {
  setTimeout(() => {
    scene.classList.add("exit");
    setTimeout(() => {
      window.location.href = "index.html";
    }, 700);
  }, 8000);
}
</script>
</body>
</html>
